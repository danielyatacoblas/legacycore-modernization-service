plugins { id 'java'; id 'org.springframework.boot' version '4.1.0'; id 'io.spring.dependency-management' version '1.1.7' }
group='com.portfolio.legacycore'; version='0.1.0-SNAPSHOT'
java { toolchain { languageVersion=JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }
dependencies {
 implementation 'org.springframework.boot:spring-boot-starter-webmvc'
 implementation 'org.springframework.boot:spring-boot-starter-validation'
 implementation 'org.springframework.boot:spring-boot-starter-jdbc'
 implementation 'org.springframework.boot:spring-boot-starter-actuator'
 implementation 'org.springframework.boot:spring-boot-starter-flyway'
 implementation 'org.flywaydb:flyway-database-postgresql'
 runtimeOnly 'org.postgresql:postgresql'
 runtimeOnly 'com.oracle.database.jdbc:ojdbc11'
 runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
 testImplementation 'org.springframework.boot:spring-boot-starter-test'
 testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8'; options.compilerArgs.addAll(['-parameters','-Xlint:all']) }
tasks.withType(Test).configureEach { useJUnitPlatform() }
springBoot { buildInfo() }
